<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fungki · Demo dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
  <script>
    // Static demo (bun run demo): no server, no sign-in. Dashboard requests read the JSON the
    // seeded server rendered at build time; every other link and request goes nowhere.
    const realFetch = fetch
    window.fetch = (input, init) => {
      const url = new URL(input instanceof Request ? input.url : String(input), location.href)
      if (url.pathname === "/api/dashboard") return realFetch(`data/${url.searchParams.get("period")}.json`)
      return Promise.resolve(new Response(null, { status: 404 }))
    }
    history.pushState = () => {}
    if (!location.search) history.replaceState(null, "", "?period=2026-10")
  </script>
  <script type="module" crossorigin src="./assets/demo-CXyFQO8A.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/demo-BWOoBPVw.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
